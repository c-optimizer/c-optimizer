directories:
  output: release-v2
  buildResources: build
appId: com.coptimizer.app
productName: C-Optimizer
copyright: Copyright © 2026 C-Optimizer
asar: true
files:
  - filter:
      - dist/**/*
      - src/main/**/*
      - src/preload/**/*
      - package.json
extraMetadata:
  main: src/main/main.js
npmRebuild: false
publish:
  provider: github
  owner: c-optimizer
  repo: c-optimizer
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: C-Optimizer
  artifactName: C-Optimizer-Setup-${version}.${ext}
asarUnpack:
  - '**/node_modules/node-pty/**'
electronVersion: 32.3.3
